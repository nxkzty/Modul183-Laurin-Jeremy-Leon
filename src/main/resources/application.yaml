spring:
  application:
    name: taskify
  docker:
    compose:
      lifecycle-management: start_only
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${POSTGRES_URL}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
vaadin:
  launch-browser: false
management:
  endpoints:
    web:
      exposure:
        include: health
